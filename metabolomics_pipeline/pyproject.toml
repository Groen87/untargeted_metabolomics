[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metabolomics_pipeline"
version = "1.0.0"
description = "A pipeline for processing metabolomics data with drift correction and normalization"
authors = [{ name = "Joost Groen", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "statsmodels>=0.12.0",
    "matplotlib>=3.4.0",
    "pyyaml>=6.0",
    "openpyxl>=3.0.0",  # For reading Excel metadata
]

[project.optional-dependencies]
dev = ["black>=22.0", "flake8>=4.0", "mypy>=0.900", "pytest>=7.0"]

[project.scripts]
metabolomics-pipeline = "main:main"