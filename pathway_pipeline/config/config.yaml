# ============================================================================
# Pathway Pipeline Configuration
# Feature-engineering stage: feature -> HMDB -> PathBank pathway mapping
# ============================================================================

# ============================================================================
# Input/Output
# ============================================================================
input_file: "data/merged_data_with_classification.csv"
output_dir: "outputs/pathway_pipeline"

# ============================================================================
# Data Configuration
# ============================================================================
patient_id_column: null
non_feature_columns:
  - "Oordeel targeted"
  - "Classification"
age_column: null

# ============================================================================
# HMDB Database
# ============================================================================
hmdb_xml_file: "data/hmdb_metabolites.xml"
use_hmdb_cache: true
min_name_length: 3

# Manual fixes for name->HMDB collisions the automatic matching chain
# resolves wrongly. Keys are exact feature column names; values are HMDB
# accessions. 'Niacin' is a primary name of both nicotinic acid
# (HMDB0001488) and nicotinamide (HMDB0001406) in the HMDB index; pin the
# plain-named feature to nicotinic acid.
feature_hmdb_overrides:
  "Niacin": "HMDB0001488"
  "(+)-Estrone": "HMDB0000145"

# Identity curation (label-blind, chemistry-based): feature columns whose
# name carries a trailing .HMDB######## tag are identified by pure-standard
# injection upstream, so within a resolved metabolite the tagged feature is
# definitely the molecule described. Plain-named twins resolving to the
# same HMDB ID (co-eluting interlopers caught by name matching, typically
# with razor-thin reference IQRs, e.g. plain 'Argininosuccinic acid' at IQR
# 0.075 vs the tagged twin at 1.13) are dropped from scoring before any
# downstream stage sees them; the metabolite's z then comes from the
# confirmed feature alone. Tagged-vs-tagged pairs sharing an ID are both
# kept (both confirmed; scale^2 weighting handles their relative noise).
# Manual overrides carry the same precedence as a tag. Dropped twins are
# logged and written to superseded_features.csv. false restores the old
# behavior of averaging all twins.
prefer_tagged_features: true

# ============================================================================
# PathBank Pathways
# ============================================================================
# PathBank primary-pathways metabolites CSV: one row per (pathway, metabolite)
# pair with the metabolite's HMDB ID. Primary pathways only -- the file has no
# pathway name or pathway-type column; pathways are identified by pathway_id.
pathbank_file: "data/pathbank_all_metabolites.csv"

# Organism to keep from the PathBank CSV's 'species' column
# (matched exactly, after whitespace stripping).
pathbank_species: "Homo sapiens"

# PathBank pathways description CSV (pathway_id -> name). Pathways missing
# from it fall back to their SMP ID as name.
pathbank_pathway_names_file: "data/pathbank_pathways.csv"

# Keep only pathways where at least this fraction of the pathway's metabolites
# are mapped to features in the dataset (0.20 = 20%).
min_pathway_coverage: 0.20

# Chemistry-based pathway curation (label-blind): a pathway whose NAME
# contains any of these keywords (case-insensitive) is dropped before
# scoring. Justification is the extraction chemistry ONLY -- e.g. a
# phase-extraction metabolomics protocol does not recover complex lipids,
# so lipid-pathway features measure extraction variability rather than
# physiology, and leaving them in inflates the normals' null distributions
# (which raises the bar for true IMDs under the max_excess rule). This is a
# class-level block criterion, never pathway-by-pathway flag performance.
# The list is empty for now (curated features are handled at the feature
# level via demoted_features instead); re-add keywords as needed, e.g.
#   - "lipid"
exclude_pathway_keywords: []

# Pathway redundancy pruning (label-blind): PathBank disease pathways are
# mechanism cartoons sharing nearly all scored metabolites with their parent
# metabolic pathway. Five pathways driven by the same three metabolites
# produce five identical flags and inflate pathway-test multiplicity.
# Pathways whose SCORED metabolite sets have Jaccard >= redundancy_jaccard are
# collapsed into connected groups, each keeping one representative chosen by
# a pre-declared composition-based preference (never flag performance, never
# disease labels): 1) general metabolic pathway over a disease cartoon
# (name without 'deficiency'/'disease'), 2) larger scored metabolite set,
# 3) alphabetical. Dropped pathways are recorded in pruned_pathways.csv.
prune_redundant_pathways: true
redundancy_jaccard: 0.8

# ============================================================================
# Z-scores (stage 2)
# ============================================================================
# Values must already be log10-transformed upstream. Z-scores are computed for
# pathway-mapped features only, using the normal samples as reference:
#   z = (x - median_i) / IQR_i   (medians/IQRs over normals only)
run_zscores: true
iqr_scale: true

# Noise-floor z-magnifiers: features whose reference IQR is below this many
# log10 units are dropped before z-scoring. The instrument barely resolves
# such features in normals, so trivial absolute shifts explode into huge
# z-scores (e.g. 2'-dCMP, Hydroxymethylbilane, thiamine monophosphate).
# null disables the floor.
min_reference_scale: 0.08

# Normal reference definition: Classification == normal_classification AND
# Oordeel targeted == normal_oordeel.
normal_classification: 0
normal_oordeel: 0

# Automated reference hygiene (label-blind): a candidate normal whose
# leave-one-out max metabolite |z| exceeds this depth is excluded from the
# calibration reference (it cannot mask its own disturbance; the peers'
# median/IQR are computed without it). Replaces hand-picked exclusion lists.
#
# max_depth justification (development-half evidence, label-blind):
# ordinary screened normals routinely reach a max metabolite |z| of ~7
# (median) to ~16 (p95 of the metabolite-depth null over 205 normals in the
# 2026-09-23 full-cohort run); a depth of 10 sits INSIDE that ordinary range
# and, with iterative rounds, cascaded to 41/107 exclusions (the run then
# flagged 57% of all samples). 20 sits beyond the ordinary-normal range,
# where the previously hand-confirmed deep disturbances (|z| >= 15-30)
# actually live.
#
# max_excluded_fraction is a pre-declared sanity cap: when hygiene would
# exclude more than this fraction of candidates, it stops at the cap and
# logs a WARNING -- a cascade is the signature of a miscalibrated max_depth,
# not of a contaminated reference. Inspect reference_hygiene.csv and
# reconsider max_depth; do NOT proceed to evaluation off a capped reference.
reference_hygiene:
  enable: true
  max_depth: 20.0
  max_excluded_fraction: 0.10

# Frozen cohort split (part of the configuration): every sample is assigned
# once, deterministically, to the development or the validation half.
# Calibration uses development normals only. The validation half is scored
# but never calibrates anything; its metrics are read once per frozen
# config version (run_evaluation).
validation_split:
  enable: true
  seed: 20260923
  fraction: 0.5

# Minimum number of usable matched metabolites for a pathway to stay in the
# scoring set after the z-score stage (Stouffer on k < 3 is dominated by a
# single outlier).
min_pathway_features: 3

# ============================================================================
# Stouffer scores (stage 3)
# ============================================================================
# Per pathway and sample, over the metabolites' z-scores (features deduplicated
# per HMDB ID):
#   z_stouffer     = sum(z_i)  / sqrt(k)   (direction-aware)
#   z_stouffer_abs = sum(|z_i|) / sqrt(k)  (disturbance regardless of direction)
# Samples with fewer than min_stouffer_metabolites usable metabolites in a
# pathway get no score for it. Per-pathway empirical percentiles of the
# absolute score over the normals are written for the calibration step.
# max_abs_z caps |z| before the Stouffer sum so a single artifact feature
# cannot dominate a whole pathway (null disables the cap).
run_stouffer: true
min_stouffer_metabolites: 3
max_abs_z: 15.0

# ============================================================================
# Flagging (stage 4)
# ============================================================================
# A (sample, pathway) pair is flagged when its absolute Stouffer score exceeds
# the flag_threshold_percentile percentile of that pathway's own normals
# (empirical per-pathway calibration: a noisy pathway automatically gets a
# wider range). A sample is flagged when at least min_flagged_pathways of its
# pathways are flagged. The Classification/Oordeel groups are joined for a
# reporting-only detection-vs-contamination summary; thresholds are never
# tuned against them.
# sample_rule sets the null a sample must beat to be flagged:
#   empirical  - flagged-pathway COUNT distribution of the normals. Measures
#     breadth: a sample must flag more pathways than most normals do.
#   max_excess  - distribution of each normal's MAXIMUM pathway excess.
#     Measures depth: a sample is flagged when its single most extreme
#     pathway exceeds what (1 - max_sample_p) of normals reach. Classic IMD
#     blocks a few pathways profoundly, while the screened "normals" shift
#     many pathways mildly -- a depth rule separates exactly those.
#   binomial    - Binomial(n_scored_pathways, 1 - percentile); only valid
#     when pathway flags are near-independent.
#   none        - count rule only (min_flagged_pathways).
# A sample is flagged when it passes the count rule AND sample_p_value <=
# max_sample_p under the chosen null.
run_flagging: true
flag_threshold_percentile: 99.0
min_flagged_pathways: 1
sample_rule: max_excess
max_sample_p: 0.05

# STEP 8c: metabolite-level flags (report-only; they never change the
# sample decision). A metabolite is flagged when its |z| exceeds the
# metabolite_flag_percentile percentile of that metabolite's |z| among the
# reference normals -- per-metabolite calibration absorbs noisy features.
# Per sample the metabolite depth p-value is the fraction of normals whose
# maximum metabolite |z| reaches the sample's maximum; it catches IMDs with
# a single grossly elevated metabolite whose pathway Stouffer score is
# diluted by the pathway's other metabolites.
run_metabolite_flags: true
metabolite_flag_percentile: 99.0

# STEP 8d: biomarker attachment channel (literature-curated prior
# knowledge, parallel to the PathBank pathway channel -- PathBank
# pathways are NEVER modified). PathBank disease pathways are
# intracellular mechanism cartoons and can omit the clinically
# diagnostic biomarkers of their disease (e.g. MCADD without
# octanoylcarnitine); this channel attaches published disease
# biomarkers to their disease pathways from a curated CSV.
#
# Curation protocol (evidence budget #3, gene/disease-level knowledge --
# label-blind by construction, the same table would be declared for any
# cohort):
# 1. Assemble attachments from SYSTEMATIC literature sources (biomarker
#    tables in reviews / newborn-screening guidelines), never from which
#    samples this pipeline flagged or missed.
# 2. Cite each row's source in the `source` column.
# 3. Freeze the table before the STEP 10 evaluation read; never edit it
#    after reading validation performance.
#
# CSV columns: smp_id OR pathway_name (the target disease pathway;
# smp_id wins when both are given), hmdb_id (biomarker accession,
# uppercase), source (citation). A missing file disables the channel
# (warning logged) until the table is provided.
#
# A sample flags the channel when an attached biomarker exceeds its own
# normal-percentile threshold AND the sample's maximum attached-biomarker
# |z| beats the biomarker-restricted depth null of the reference normals
# (same frozen max_sample_p as the pathway channel). The channel ORs into
# the sample decision; per-channel calls are recorded in
# sample_decisions.csv (flagged_pathway_channel, biomarker_flagged) and
# biomarker_flags.csv for audit.
biomarker_channel:
  enable: true
  attachments_file: "data/pathway_biomarker_attachments.csv"
  threshold_percentile: 99.0

# STEP 9: label-blind development QC (calibration check, noise floor,
# diverging duplicates, threshold stability, pathway redundancy). Iterate
# freely on this output; IMD labels are never read.
run_development_qc: true
development_qc_bootstrap: 200

# STEP 10: one-shot label-aware evaluation of the frozen config. Enable
# only when the configuration is frozen. Reading the validation metrics
# and then changing the config invalidates the validation half.
run_evaluation: false
evaluate_dev_half: false

# Demoted artifact features, justified by CHEMISTRY/ANALYTICAL PRIORS ONLY
# (an allowed evidence budget -- no group/disease counts informed this
# list). Demoted features keep their z-scores in metabolite_zscores.csv but
# never contribute to pathway Stouffer sums, metabolite flags, or threshold
# calibration. Entries must be EXACT feature column names of features that
# are actually z-scored; the pipeline logs a warning for unmatched entries.
#
# Justifications:
# - Reduced Glutathione: oxidation-labile (classic pre-analytical artifact)
# - Urocanic acid.HMDB0000301: light- and heat-labile
# - hexahydro-2-oxo-thieno(3,4-d)imidazole-4-pentanoic acid: biotin
#   degradation product
# - Premarin: conjugated EQUINE estrogen drug preparation, not a human
#   metabolite
# - Safingol: non-endogenous stereoisomer of sphinganine (investigational
#   drug; likely a stereo-misassignment of sphinganine, which is scored
#   separately)
# - Tretinoin and 4-Oxotretinoin: endogenous all-trans retinoic acid is a
#   signaling molecule, but endogenous levels are low-nM; in an untargeted
#   screen these features reflect retinoid MEDICATION use, and no IMD
#   presents through retinoic acid
#
# NOT scored anyway, so no demotion entry needed (re-add if pathway mapping
# ever brings them in): thiamine monophosphate (reference IQR below the
# scale floor), creatinine (strong age dependence, but not pathway-mapped),
# Caffeine, Theophylline, methylxanthine, 1,3,7-Trimethyluric acid,
# Diphyllin, Myrmicacin (exogenous/medication, but not pathway-mapped).
demoted_features:
  - "Reduced Glutathione"
  - "Urocanic acid.HMDB0000301"
  - "hexahydro-2-oxo-1h-thieno(3,4-d)imidazole-4-pentanoic acid"
  - "Premarin"
  - "Safingol"
  - "Tretinoin"
  - "4-Oxotretinoin"

# Combine features mapping to the same metabolite (HMDB ID) with scale^2
# weights instead of a plain mean: under a constant absolute analytical
# error the noise variance of a feature's z is (error/scale)^2, so the
# wider-scale duplicate is the trustworthy one and a razor-thin duplicate
# cannot dominate the metabolite's z.
scale_weighted_metabolites: true

# ============================================================================
# Output
# ============================================================================
save_mapping_outputs: true
save_zscore_outputs: true
save_stouffer_outputs: true
save_flagging_outputs: true
