# Pathway Pipeline Configuration
# This is a CLEAN configuration for the new pathway analysis

# ============================================================================
# Input/Output
# ============================================================================
input_file: "data/merged_data_with_classification.csv"
output_dir: "outputs/pathway_pipeline"

# ============================================================================
# Data Configuration
# ============================================================================
patient_id_column: null

non_feature_columns:
  - "Oordeel targeted"
  - "Classification"

# Classification scheme:
#   class1_imd: normals = Class 0 AND Oordeel 0; IMD = Class 1 AND Oordeel 1
classification_scheme: class1_imd

# ============================================================================
# HMDB Database
# ============================================================================
hmdb_xml_file: "data/hmdb_metabolites.xml"
use_hmdb_cache: true
min_name_length: 3

# ============================================================================
# Pathways
# ============================================================================
pathways_file: "data/pathways.tsv"
min_pathway_size: 3

# ============================================================================
# Clean Pathway Analysis (NEW)
# ============================================================================
# This is the NEW clean implementation that replaces the buggy enhanced pipeline
run_stats: true

# Age adjustment (optional)
age_column: null
age_adjustment_method: ols
age_loess_frac: 0.5
iqr_scale: true

# Clean pathway analysis parameters
# These control the NEW implementation in pathway_analysis_clean.py
min_detection: 0.80           # Target: flag >80% of IMDs
max_contamination: 0.05       # Target: flag <5% of normals
min_flagged_pathways: 1      # IMDs typically have 1-2 extreme pathways
n_thresholds: 20              # Number of percentiles to test for optimal threshold

# ============================================================================
# Anomaly Detection (NEW)
# ============================================================================
# Train anomaly detector on NORMAL samples only, test on ALL samples
# This is the correct approach for low prevalence (2% IMDs in production)
use_anomaly_detection: true

# Anomaly detection method: 'lof', 'iforest', or 'mahalanobis'
# - lof: Local Outlier Factor (good for heterogeneous IMDs affecting different pathways)
# - iforest: Isolation Forest (fast, good general performance)
# - mahalanobis: Mahalanobis distance (parametric, assumes Gaussian distribution)
anomaly_scorer: lof

# Anomaly detection parameters
anomaly_contamination: 0.02    # Expected IMD rate in production (2%)
anomaly_n_neighbors: 20         # For LOF: number of neighbors
anomaly_n_estimators: 100       # For IForest: number of trees
anomaly_percentile: 95.0       # Percentile for thresholding (higher = more strict)
anomaly_random_state: 42       # Random seed for reproducibility

# ============================================================================
# Legacy parameters (kept for compatibility, not used in clean pipeline)
# ============================================================================
normal_classification: 0
outlier_classifications:
  - 1
  - 2
  - 3

flag_percentile: 99
metabolite_override_threshold: 6.0

zmed_threshold: 2.0
flagged_fraction_threshold: 0.5
signed_extreme_threshold: 2.5
severe_zmed_threshold: 3.0
severe_flagged_fraction_threshold: 0.7
severe_signed_extreme_threshold: 4.0

min_severe_pathways: 3
min_moderate_pathways: 8
min_severe_zmed: 5.0
min_moderate_zmed: 3.5

global_anomaly_top_k: 10
global_threshold: null

run_threshold_tuning: false
tuning_metric: f1
tuning_prevalence: 0.02
tuning_override_grid: [4.0, 5.0, 6.0, 8.0, 10.0]
tuning_moderate_zmed_grid: [1.5, 2.0, 2.5, 3.0]
tuning_severe_zmed_grid: [2.5, 3.0, 3.5, 4.0]
tuning_signed_extreme_grid: [2.5, 3.0, 4.0]

suppress_numpy_warnings: true

# ============================================================================
# Enhanced statistics (DEPRECATED - not used)
# ============================================================================
use_enhanced_stats: false

# ============================================================================
# Output
# ============================================================================
save_mapping_outputs: true

# ============================================================================
# Visualization (optional)
# ============================================================================
generate_imd_visualizations: false
visualization_top_n: 15
visualization_dpi: 150
