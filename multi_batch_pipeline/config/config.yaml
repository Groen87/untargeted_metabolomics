# Multi-Batch Metabolomics Pipeline Configuration

# File paths (relative to project root or absolute)
batch_folders: ["MZ25_36", "MZ25_38", "MZ25_43", "MZ25_45", "MZ25_50", "MZ25_53", "MZ26_10", "MZ26_15", "MZ26_16", "MZ26_21"]  # List of batch folders to process (can override via --batches)
intensity_threshold: 10000
qc_pattern: "expQC"
fallback_qc_pattern: "QC3"  # Fallback QC pattern if expQC not found
qc_intensity_threshold: 1
frac: 0.5
rt_threshold: 0.02

# Logging
log_level: "INFO"
log_file: "logs/multi_batch_pipeline.log"

# Multi-batch options
run_qc: true
save_plots: true
show_plots: false
