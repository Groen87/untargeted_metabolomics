# Combined Batch Pipeline Configuration

# Input/Output
input_file: "data/combined_all_batches.csv"
output_dir: "output/combined_batch_pipeline"

# Processing parameters
frac: 0.5
rt_threshold: 0.02
ref_batch: null

# ============================================================================
# Feature Filtering Configuration
# ============================================================================
# All filters are applied in order and are configurable.
# Set any filter to false to disable it.
#
# Filter order:
# 1. Low intensity (remove low-signal features first)
# 2. Blank contaminants (removed to avoid skewing other filters)
# 3. Low variance (near-constant features)
# 4. Single batch features (gap-filled in others)
# 5. High RSD in QC3 samples (remove features with RSD > 30% in QC3)
# Note: QC present and QC intensity filters removed as per user request

# Filter 1: Low intensity
# Removes features with low mean intensity across all samples
filter_low_intensity: true
# Option A: Absolute threshold
intensity_threshold: 100000.0  # Features with mean intensity < this are removed
# Option B: Quantile-based (uncomment to use instead of absolute threshold)
# intensity_quantile: 0.1  # Remove bottom N% by intensity

# Filter 2: Blank sample contaminants
# Removes features that are high in blank samples (likely contaminants)
filter_blank_contaminants: true
blank_pattern: "blanco"  # Pattern to identify blank samples (case-insensitive)
blank_ratio_threshold: 3.0  # Features with blank/bio ratio > this are removed
blank_high_signal_threshold: 10.0  # Keep features if any bio sample >= this * blank_mean (loophole for high-signal features)

# Filter 3: Low variance (near-constant features)
# Removes features with almost no variation (uninformative or noise)
filter_low_variance: true
# variance_threshold: 0.01  # Absolute variance threshold (features with var < this are removed)
# Alternative to threshold: use quantile to remove bottom N% by variance
variance_quantile: 0.05  # Remove bottom 5% by variance

# Filter 4: Single batch features
# Removes features only present in a single batch (gap-filled in others)
filter_single_batch: true
min_batches: 2  # Features must be present in at least this many batches
single_batch_noise_quantile: 0.10  # Noise threshold = this quantile * global median (default: 10%)
                                        # Increase to 0.25 or 0.50 if gap-filled values are higher

# Filter 5: High RSD in QC3 samples
# Removes features with RSD > 30% across all QC3 samples
filter_high_qc3_rsd: true
qc3_rsd_threshold: 30.0  # RSD threshold in QC3 samples (features with RSD > this are removed)

# ============================================================================
# QC Sample Detection
# ============================================================================
qc_pattern: "expQC"
fallback_qc_pattern: "QC3"

# ============================================================================
# Legacy parameters (kept for backwards compatibility)
# ============================================================================
intensity_threshold: 100000
qc_intensity_threshold: 0.1

# ============================================================================
# Logging
# ============================================================================
log_level: "INFO"
log_file: "logs/combined_batch_pipeline.log"

# Options
run_qc: true
save_plots: true
show_plots: false

# ============================================================================
# RALPS Configuration (Alternative Batch Correction)
# ============================================================================
# RALPS is run after ComBat for comparison
# Set run_ralps to false to skip RALPS correction

run_ralps: true

# QC sample patterns for RALPS
# QC3 samples are used for regularization (group column)
# QC4 and blaauw samples are used for benchmarking (benchmark column)
qc3_pattern: "QC3"
qc4_pattern: "QC4"
blaauw_pattern: "blaauw"

# RALPS parameters (optional overrides)
# These are passed to RALPS config file
# See https://github.com/zamboni-lab/RALPS for full parameter descriptions
ralps_config:
  latent_dim: -1  # -1 = automatically derived from PCA
  variance_ratio: "0.9,0.95,0.99"
  n_replicates: 3
  grid_size: 1
  d_lr: "0.00005-0.005"
  g_lr: "0.00005-0.005"
  d_lambda: "0.-10."
  g_lambda: "0.-10."
  v_lambda: "0.-10."
  train_ratio: 0.9
  batch_size: "32,64,128"
  epochs: 30
  skip_epochs: 3
  keep_checkpoints: false
  device: "cpu"
  min_relevant_intensity: 1000
  allowed_vc_increase: 0.05
