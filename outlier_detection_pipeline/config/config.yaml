# Outlier Detection Pipeline Configuration

# ============================================================================
# Input/Output
# ============================================================================
input_file: "data/merged_data_with_classification.csv"
output_dir: "outputs/outlier_detection"

# ============================================================================
# Data Configuration
# ============================================================================
# Column names in the input CSV
patient_id_column: null  # Patient IDs are row index (not a column)
feature_columns: null     # All columns except the ones listed below
non_feature_columns:
  - "Oordeel targeted"
  - "Classification"
# The 'Non-treated' column (copied into the merged data by the
# combined_batch add_classification step) is not a feature: the loader keeps
# it out of the feature matrix automatically. It is used by the lab-protocol
# ground-truth roles: within the (Classification 1, Oordeel targeted 1) IMD
# group, Non-treated 1 = non-treated IMD = true outlier; Non-treated 0/NaN =
# treated IMD = gray (not counted in the headline TP/FN totals).

# How to build the binary sample label from the raw Classification column.
#   default          : Legacy Oordeel-based cleaning. Drops ambiguous samples
#                     (Classification 2/3 with Oordeel targeted = 0) and
#                     reclassifies Classification=0 with Oordeel targeted!=0
#                     as outliers (Classification -> 1).
#   binary_simplified: Ignore Oordeel entirely and remap to a clean binary
#                     label: Classification 1 -> outlier (1), Classification 2
#                     -> dropped, Classification 0 or 3 -> inlier (0).
#   oordeel          : Ignore the raw Classification entirely and derive the
#                     label from Oordeel targeted: 0 -> inlier (0),
#                     1 -> outlier (1). Samples with any other Oordeel value
#                     are dropped.
#   confident_normals : Semi-supervised strategy. Training inliers = ONLY the
#                     confident normals (Classification 0 AND Oordeel targeted
#                     0); every other sample is labelled outlier (1) and used
#                     only for testing. No samples are dropped, so all groups
#                     appear in the test set for the per-group breakdown.
classification_scheme: confident_normals

# Feature filtering (optional)
feature_filter: null  # Filter features by substring. Options: null (no filter), 'hmdb', or custom string/list

# Manual metabolite exclusion (optional)
# List metabolite/feature names to drop from the analysis. Matching is exact
# and case-insensitive (after Unicode normalization), so enter the names
# exactly as they appear in the input CSV columns. Leave empty/null to disable.
exclude_metabolites:
  - "Creatinine"  # Example: exclude this metabolite from the analysis
# Additional metabolites to exclude:
#   - "Glucose"
#   - "HMDB0000122"

# Medication exclusion (optional; same exact, case-insensitive matching as
# exclude_metabolites, kept as a separate list so drugs and endogenous
# metabolites can be curated independently). Enter the names exactly as they
# appear in the input CSV columns. Leave empty/null to disable.
exclude_medications:
  # Drug parents
  - "Sulfamethoxazole.HMDB0015150"
  - "Lidocaine.HMDB0014426"
  - "Metronidazole.HMDB0015052"
  - "Lamotrigine.HMDB0014695"
  - "Carbamazepine.HMDB0014704"
  - "Nitisinone.HMDB0014492"
  - "Midazolam.HMDB0014821"
  - "Mycophenolic acid.HMDB0015159"
  - "Trimethoprim.HMDB0014583"
  - "Acetaminophen.HMDB0001859"
  - "Metoprolol.HMDB0001932"
  - "Etoricoxib.HMDB0015565"
  - "Diazoxide.HMDB0015251"
  - "Aciclovir.HMDB0014925"
  - "Diazepam.HMDB0014967"
  - "Meloxicam.HMDB0014952"
  - "Amitriptyline.HMDB0014466"
  - "Baclofen.HMDB0014327"
  - "Omeprazol.HMDB0001913"
  - "Dexamethasone.HMDB0015364"
  - "Labetalol.HMDB0014736"
  - "Sertraline.HMDB0005010"
  - "Ceftriaxone.HMDB0015343"
  - "Amoxicillin.HMDB0015193"
  - "Fluconazole.HMDB0014342"
  - "Levetiracetam.HMDB0015333"
  - "Vigabatrin.HMDB0015212"
  - "Pregabalin.HMDB0014375"
  - "Clobazam.HMDB0014493"
  - "Furosemide.HMDB0001933"
  - "Valproic acid.HMDB0001877"
  - "Ticagrelor.HMDB0015702"
  # Drug metabolites
  - "norlidocaine.HMDB0060656"
  - "norclobazam.HMDB0060970"
  - "Salicylic acid.HMDB0001895"  # aspirin metabolite

# Substring-based feature exclusion (negative deny-list; complements the
# endogenous keep-list). Any feature column whose name contains one of these
# substrings (case-insensitive) is dropped. Use to remove features that
# mention a non-endogenous atom/group. Leave empty/null to disable.
exclude_substrings:
  - "bromo"
  - "iodo"
  - "chloro"
  - "fluoro"
  - "silyl"
  - "cyano"
  - "boronic"

# HMDB filtering - keep only endogenous (Metabolic/Disease pathway) metabolites
# Reads endogenous_metabolites.tsv produced by hmdb_drug_filter.py
# (columns: HMDB_ID, Name, Synonyms). Acts as a positive keep-list:
# only features matching a name in the file are kept; HMDB-prefixed
# feature columns are always kept regardless.
filter_to_endogenous: false  # Filter features to the endogenous metabolite keep-list
use_hmdb_cache: true  # Use cached HMDB data for faster subsequent runs
endogenous_metabolites_file: null  # Path to endogenous_metabolites.tsv (output of hmdb_drug_filter.py)

# SMPDB pathways filtering - keep only features whose HMDB accessions appear
# in the SMPDB pathways file. Uses the EXACT same matching chain as the
# pathway_pipeline (HMDB tag -> exact name -> loose name against the HMDB XML
# name index), then keeps a feature if any resolved accession is in a pathway.
# Pathways are NOT turned into features; this is purely a feature filter.
# hmdb_xml_file must point to the same hmdb_metabolites.xml the
# pathway_pipeline uses, otherwise plain-name features cannot resolve and
# only HMDB-tagged features will match.
filter_to_smpdb_hmdb: false  # Filter features to those with HMDB codes in SMPDB pathways
smpdb_pathways_file: null  # Path to smpdb_kept_pathways.tsv
hmdb_xml_file: "data/hmdb_metabolites.xml"  # Same HMDB XML as pathway_pipeline uses
# Print every HMDB-tagged feature name (one per line) after loading, so they
# can be reviewed and curated into e.g. a medication exclusion list.
log_hmdb_tagged_features: false

# Outlier analysis
# Univariate guardrail (deployment-time clinical safety net). A deterministic,
# OR-combined flag that catches samples the multivariate model misses on
# clinically must-not-miss metabolites. For each listed biomarker, computes
# its mean/std over the TRAINING confident normals and flags any test sample
# whose signed Z-score on that biomarker exceeds z_threshold in magnitude.
# Writes guardrail_flags.csv (one row per fired biomarker-sample pair) and is
# OR-combined with the model flag at deployment: a sample is reviewed if the
# guardrail fires OR the model flags it. This does NOT filter training data.
# Leave the list empty (or omit the section) to disable (default). Match each
# `name` exactly to a feature column name (case-insensitive).
univariate_guardrail:
  biomarkers: []
  # Example (catch samples with extreme acylcarnitines the model misses):
  # biomarkers:
  #   - name: "Glutarylcarnitine"
  #     z_threshold: 10
  #   - name: "Glutaric acid"
  #     z_threshold: 10
use_zscore_analysis: true  # Use Z-scores (True) or log IQR (False) for outlier feature analysis
log_iqr_feature_filter: null  # Filter features for analysis. Options: null (no filter), 'hmdb', or custom string/list

# ============================================================================
# Sparse PCA for Dimensionality Reduction
# ============================================================================
use_sparse_pca: true      # Toggle sparse PCA on/off
n_components: 100          # Number of principal components to keep
alpha: 1.0                # Sparsity controlling parameter (higher = more sparse)
max_iter: 1000            # Maximum iterations for sparse PCA
pca_random_state: 42      # Random seed for sparse PCA
save_pca_model: true      # Save the fitted PCA model
pca_nan_strategy: drop_columns  # How to handle NaN: 'drop_columns', 'drop_rows', or 'impute_mean'
pca_method: regular         # PCA method: 'regular', 'sparse', 'mini_batch_sparse', 'two_phase'
pca_batch_size: 1000       # Batch size for mini_batch_sparse
pca_intermediate_components: null  # Intermediate components for two_phase (null = auto: min(500, n_components*5))

# ============================================================================
# Extended Isolation Forest Parameters
# ============================================================================
n_estimators: 200         # Number of trees in the forest (used directly when tuning is off; >100 barely changes IF ranking)
max_samples: "auto"       # Number of samples to draw for each tree
max_features: 1.0         # Number of features to draw for each tree
bootstrap: false          # Whether to use bootstrap sampling
n_jobs: -1                # Number of jobs for parallel processing (-1 = all)
random_state: 42          # Random seed
contamination: "auto"     # Expected proportion of outliers (auto or float)

# Anomaly scorer. Selects the one-class detector that scores samples after
# (optional) PCA. All scorers share the same lower-more-anomalous score
# convention, so the OOF threshold calibration, drift diagnostic, and realistic
# evaluation work unchanged. Options:
#   iforest     : IsolationForest (the original default; nonparametric)
#   mahalanobis : Mahalanobis distance (robust/shrinkage covariance); parametric
#   pca_recon   : PCA reconstruction error (fits a 2nd PCA on the reduced
#                 features; scores by reconstruction error)
#   ocsvm       : One-Class SVM (RBF); nonparametric boundary
#   ae          : MLP autoencoder reconstruction error (requires torch)
#   deep_svdd   : Deep Support Vector Data Description (requires torch)
#   lof         : Local Outlier Factor; local-density mechanism
#   knn         : k-th nearest-neighbor distance to training normals
#   ensemble    : Averages z-normalized scores from sub_scorers (default
#                 iforest + ocsvm); combines different failure modes
# Hyperparameter tuning (use_hyperparameter_tuning) only applies to iforest.
scorer: iforest

# Feature scaling applied before the anomaly scorer. The scaler is ALWAYS fit
# on the training normals only; every other sample (test normals, abnormals)
# is transformed with that fitted scaler (pure one-class design).
#   robust   : RobustScaler, median/IQR (default; robust to outliers, but its
#              IQR estimate is noisy at small n and zero-IQR features keep
#              their raw scale)
#   standard : StandardScaler, mean/std
#   none     : no scaling at all -- the model runs on the input scale, e.g.
#              log10-transformed but unscaled data (set scorer: lof to run
#              Local Outlier Factor on non-scaled log-transformed data)
scaler: "robust"
# Optional per-scorer kwargs (e.g. for ocsvm: {nu: 0.05, gamma: scale};
# for pca_recon: {n_components: 20}; for ae/deep_svdd: {hidden_dim: 16,
# latent_dim: 8, epochs: 200}; for lof: {n_neighbors: 20}; for knn:
# {n_neighbors: 5}; for ensemble: {sub_scorers: [iforest, ocsvm]}).
# Leave null for defaults.
scorer_kwargs: null

# ============================================================================
# Cross-Validation
# ============================================================================
n_splits: 3              # Number of CV folds (for training set)
use_cv_with_abnormal: true  # Include abnormal samples in CV folds for realistic evaluation

# ============================================================================
# Evaluation Strategy
# ============================================================================
evaluation_strategy: realistic  # 'standard' or 'realistic' - Use realistic for LOO abnormal testing

# ============================================================================
# Realistic Evaluation
# ============================================================================
realistic_test_contamination: 0.02  # Deployment prevalence & absolute threshold. (1) Flag threshold = the (100 * this)-th percentile of the normal-TRAINING score_samples() distribution; a test sample is flagged only if its score falls below it (clean batch can flag 0). (2) Assumed prevalence used to compute precision/F1/accuracy analytically (the test set itself has a higher prevalence). Decoupled from the higher contamination used during training/tuning.
realistic_n_iterations: 36  # Deprecated. Scoring is now a single deterministic pass (IsolationForest scores rows independently of batch composition), so no Monte-Carlo iteration is needed. Kept for config compatibility; ignored at runtime.
realistic_n_outliers_true: null  # Number of true outliers (optional, overrides contamination)

# Outer cross-validation over the whole pipeline. When >1, the full
# train->PCA->evaluate process runs k times, each fold as a held-out test
# set, and per-fold results are aggregated (mean/std). This averages out an
# unlucky single train/test split on small datasets and gives honest,
# out-of-sample detection-rate / FPR / ROC-AUC estimates across folds. 1 =
# the standard single stratified split above.
cv_outer_folds: 1

# Confident-normals single split (used when classification_scheme:
# confident_normals AND cv_outer_folds: 1). Fraction of the confident
# normals used to TRAIN the model; the rest are held out to measure FPR and
# scored alongside ALL abnormals in one pass. No k-fold, so abnormals never
# enter training and stay independent.
train_ratio: 0.8

# Drift diagnostic. When true, the pipeline logs the train-normal vs
# test-normal vs test-abnormal score_samples() distributions (mean, 2nd/50th/
# 98th percentiles), flags when the test-normal FPR at the calibrated
# threshold diverges from the nominal deployment contamination, and saves a
# 2-PC scatter coloured by train/test split (drift_diagnostic.csv / .json /
# _pca.png). Use to tell split noise from real batch/cohort drift.
run_drift_diagnostic: true

# Components sweep. Set `evaluation_strategy: components_sweep` to run the
# full pipeline once per n_components value listed here and produce a
# detection-rate-vs-FPR curve, so you can pick the n_components that keeps
# FPR acceptable while maximizing detection. Each value uses outer k-fold
# CV (cv_outer_folds, or 5 if 1) for an honest out-of-sample estimate that
# averages out split noise. Outputs per value under
# outputs/outlier_detection/sweep_components_<N>/, plus components_sweep.csv
# and components_sweep.png with the tradeoff curve.
components_sweep_values: [10, 20, 30, 40, 50, 60, 80, 100]

# ============================================================================
# Hyperparameter Tuning
# ============================================================================
# IsolationForest is largely insensitive to its hyperparameters in the
# low-contamination regime (n_estimators above ~100 barely changes ranking;
# max_samples='auto' is near-optimal; max_features=1.0 is standard). Tuning
# the grid typically yields a marginal, high-variance "best" that doesn't
# generalize. The dominant levers are the threshold calibration and the
# scoring representation (PCA vs raw), neither of which tuning touches.
# Default: skip tuning and use the fixed IF defaults below.
use_hyperparameter_tuning: false  # Toggle hyperparameter tuning on/off
n_splits_tuning: 3               # Number of CV folds for tuning
tuning_scoring: pr_auc          # Metric to optimize ('f1', 'precision', 'recall', 'roc_auc', 'pr_auc', 'prauc')

# Parameter grid for tuning (used if use_hyperparameter_tuning is true)
# If null, uses default grid
param_grid: null

# Parameter grid for AE tuning (used when scorer: ae AND use_hyperparameter_tuning: true).
# Sweeps the bottleneck (latent_dim), hidden width (hidden_dim), epochs, and lr.
# If null, uses a default grid sweeping latent_dim (the most impactful AE lever),
# hidden_dim, and epochs. Tune lr only if the loss diverges.
ae_param_grid: null

# ============================================================================
# Optuna Configuration (for Bayesian optimization)
# ============================================================================
use_optuna: false          # Use Optuna for hyperparameter tuning (requires optuna package)
n_trials: 100              # Number of Optuna trials
optuna_sampler: tpe       # Sampler type: 'tpe', 'random', 'cmaes'
optuna_pruner: median      # Pruner type: 'median', 'halving', or null for no pruning
optuna_storage_url: null   # Storage URL for Optuna study (e.g., 'sqlite:///optuna.db')
optuna_study_name: null    # Name for Optuna study (null = auto-generated)

# ============================================================================
# Evaluation Metrics
# ============================================================================
# Metrics to compute (all standard classification metrics)
metrics:
  - accuracy
  - f1
  - f1_weighted
  - precision
  - recall
  - roc_auc
  - confusion_matrix

# ============================================================================
# Output
# ============================================================================
save_predictions: true    # Save predictions to CSV
save_model: true          # Save trained model
save_plots: true          # Save evaluation plots
save_realistic_results: true  # Save per-iteration results for realistic evaluation
